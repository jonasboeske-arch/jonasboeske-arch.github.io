<style>
:root{--bg:#0a1d1a;--card:#122d28;--line:#2b5248;--ink:#eef4ee;--mut:#a8c1b6;--mint:#b4dbbc;--amb:#f4d598;--err:#ffb9b0;--p:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
.w{width:min(640px,100% - 32px);margin:auto}
h1,h2,h3{font-family:Georgia,serif;line-height:1.2;font-weight:600}
h1{font-size:clamp(2rem,6vw,2.7rem);margin:.2em 0 .4em}
h2{font-size:1.9rem;margin:0 0 .2em;outline:0}
h3{font-size:1.05rem;margin:0 0 6px}
.brand{color:var(--mint);font-weight:700;margin:0}
.lead,.sub{color:var(--mut);margin:0 0 1.2em}
a{color:var(--mint)}
.top{position:sticky;top:0;z-index:5;background:#0a1d1af2;backdrop-filter:blur(8px);padding:12px 0 14px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--mut)}
.track{position:relative;height:2px;background:var(--line);margin:18px 11px 4px}
.fill{height:100%;background:var(--mint);width:calc(var(--p)*100%);transition:width .5s}
.moon{position:absolute;top:-10px;left:calc(var(--p)*100%);margin-left:-10px;width:20px;height:20px;border-radius:50%;background:var(--mint);overflow:hidden;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--mint);transition:left .5s}
.moon i{position:absolute;inset:0;border-radius:50%;background:var(--bg);transform:translateX(calc(var(--p)*-100%));transition:transform .5s}
main{padding:32px 0 130px}
.note{padding:14px 16px;border:1px solid var(--line);border-radius:12px;color:var(--mut);font-size:.93rem;margin:14px 0}
.note b{color:var(--ink)}
.q{display:block;border:0;padding:0;margin:30px 0;min-width:0}
.q>label,legend,.l{display:block;padding:0;font-weight:650;margin-bottom:10px}
input[type=text],input[type=email],input[type=number],input[type=time],textarea{width:100%;background:#0d2622;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 14px;font:inherit}
textarea{min-height:72px;resize:vertical}
.chips+textarea,.sc+textarea{margin-top:10px}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--amb);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;padding:10px 16px;border:1px solid var(--line);border-radius:99px;color:var(--mut);cursor:pointer;transition:background .15s,color .15s}
.chips input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chips label:has(input:checked){background:var(--mint);border-color:var(--mint);color:#0a1d1a;font-weight:650}
.chips label:has(input:focus-visible){outline:3px solid var(--amb);outline-offset:2px}
.sc{padding:4px 0}
.sc .sl{font-size:.9rem;color:var(--mut)}
.sc output{display:block;font:600 2rem/1.3 Georgia,serif;color:var(--mint)}
.sc.u output{font:.95rem/2.6 system-ui,sans-serif;color:var(--mut)}
.sc input[type=range]{width:100%;height:32px;accent-color:var(--mint)}
.sc.u input[type=range]{opacity:.5}
.sc input:focus-visible{outline:3px solid var(--amb);border-radius:6px}
.lb{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mut)}
.st{margin:-10px 0 30px;padding:14px 16px;border-left:3px solid var(--amb);background:var(--card);border-radius:0 12px 12px 0;font-size:.93rem;animation:in .5s}
.st b{color:var(--amb)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tg h3{color:var(--mint)}
.tg label{display:block;font-size:.85rem;color:var(--mut);margin-top:10px}
.calc{font-size:.88rem;color:var(--mut);min-height:1.4em}
.dim{padding:20px 0;border-top:1px solid var(--line)}
.gap{margin:6px 0 0;color:var(--amb);font-size:.92rem;min-height:1.4em}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--mut);margin:26px 0 8px}
.chk input{margin-top:6px;accent-color:var(--mint)}
.err{color:var(--err);min-height:1.4em;margin:0}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0a1d1af2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 0}
.nav .w{display:flex;justify-content:space-between;gap:12px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:12px 24px;border:1px solid var(--mint);background:var(--mint);color:#0a1d1a;cursor:pointer}
.btn.g{background:transparent;color:var(--mint)}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
footer{padding:0 0 40px;color:var(--mut);font-size:.88rem}
.st+.st{margin-top:-18px}.st .rv{margin-top:10px}.st .fb{color:var(--amb)}
.qz{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}.qz button{font:inherit;padding:8px 16px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--mut);cursor:pointer}.qz button:hover:not(:disabled){border-color:var(--mint)}.qz button:disabled{cursor:default}.qz button.ok{background:var(--mint);border-color:var(--mint);color:#0a1d1a;font-weight:650}.qz button.pick:not(.ok){border-color:var(--amb);color:var(--amb)}.qz button:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.ms{margin:0 0 16px;color:var(--amb);font-size:.93rem}.sj{margin-top:14px;color:var(--amb)}
.full .moon{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--mint),0 0 22px 4px #b4dbbc88}
@media(max-width:560px){.tg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.nav{display:none}.sec[hidden]{display:block!important}body{background:#fff;color:#000}.sub,.lead,.note,.lb,.sl{color:#333}input,textarea{background:#fff;color:#000;border-color:#999}.sc output{color:#000}}
</style>
</head>

'13_Aufstehzeit_Schwankung':[['Regelmäßige Schlaf-Wach-Zeiten gelten laut Expertenkonsens als wichtiger Baustein für Gesundheit und Leistungsfähigkeit. Dass eine einzelne Änderung bei Ihnen wirkt, ist damit nicht versprochen.','https://www.sleephealthjournal.org/article/S2352-7218(23)00166-3/fulltext','Sleep Health Journal']],
'14_Gruende_Abweichung':[['Der Unterschied zwischen Schlafzeiten an Arbeits- und freien Tagen heißt „sozialer Jetlag“. In einer Befragung von über 500 Personen war er bei späten Chronotypen am größten und hing mit mehr Genussmittelkonsum und geringerem Wohlbefinden zusammen. Das sind Zusammenhänge, kein Beweis für Ursache und Wirkung.','https://pubmed.ncbi.nlm.nih.gov/16687322/','Wittmann et al., 2006']],
'16_Verschiebung_mehr_als_eine_Stunde':[['In einer britischen Beobachtungsstudie mit rund 61.000 Erwachsenen (Armband-Sensor, 7 Tage) sagte die Regelmäßigkeit des Schlafs das Sterberisiko stärker voraus als die Schlafdauer. Beobachtung, kein Beweis für Ursache und Wirkung.','https://www.ukbiobank.ac.uk/publications/sleep-regularity-is-a-stronger-predictor-of-mortality-risk-than-sleep-duration-a-prospective-cohort-study/','Windred et al., Sleep 2024',['Was sagte in dieser Studie das Sterberisiko stärker voraus?',['Die Schlafdauer','Die Regelmäßigkeit'],1]]],
'17_Schlafdauer_Grundlage':[['Zeit im Bett und tatsächlicher Schlaf sind nicht dasselbe. Die AASM beschreibt Schlafprotokolle als Hilfsmittel, um Zeiten und Gewohnheiten über mehrere Nächte sichtbar zu machen. Dieser Fragebogen ersetzt kein Protokoll, Schätzungen sind aber völlig in Ordnung.','https://sleepeducation.org/resources/sleep-diary/','AASM Sleep Education'],
['Die Fachgesellschaften AASM und SRS empfehlen gesunden Erwachsenen regelmäßig mindestens 7 Stunden Schlaf pro Nacht. Eine feste Obergrenze nennt die Empfehlung nicht. Der persönliche Bedarf kann abweichen.','https://pmc.ncbi.nlm.nih.gov/articles/PMC4434546/','AASM und SRS, 2015',['Wie viele Stunden Schlaf empfehlen die Fachgesellschaften gesunden Erwachsenen mindestens?',['6','7','8'],1]]],
'23_Nickerchen':[['Eine Übersichtsarbeit kommt zu dem Schluss: Ein Nickerchen unter 30 Minuten steigert Wachheit und Leistung. Lange Nickerchen führen eher zu Trägheit nach dem Aufwachen, und häufige lange Nickerchen hängen in Beobachtungsstudien mit schlechteren Gesundheitswerten zusammen, besonders bei älteren Menschen.','https://pubmed.ncbi.nlm.nih.gov/17053484/','Milner und Cote, 2006']],
'24d_Belastbarkeit':[['In einem Laborexperiment schliefen gesunde Erwachsene 14 Nächte lang nur 4 oder 6 Stunden. Ihre Leistung in Konzentrationstests sank von Tag zu Tag, ihr Müdigkeitsgefühl stieg danach nur noch wenig. Die Teilnehmenden unterschätzten ihre Einbußen also.','https://pubmed.ncbi.nlm.nih.gov/12683469/','Van Dongen et al., Sleep 2003',['Merken wir selbst, wie sehr zu wenig Schlaf die Leistung senkt?',['Ja, sofort und genau','Nur begrenzt'],1]]],
'28_Koffein':[['Nach der EFSA können schon 100 mg Koffein nahe der Schlafenszeit bei manchen Erwachsenen Schlafdauer und Schlafmuster beeinflussen. Die Reaktion ist individuell, deshalb fragen wir nach Menge und Uhrzeit.','https://www.efsa.europa.eu/en/topics/topic/caffeine','EFSA'],
['In einer kleinen Studie mit 12 gesunden Erwachsenen verkürzten 400 mg Koffein (etwa 2–3 Tassen Kaffee) die gemessene Schlafzeit um mehr als eine Stunde, selbst wenn sie 6 Stunden vor dem Zubettgehen genommen wurden.','https://pmc.ncbi.nlm.nih.gov/articles/PMC3805807/','Drake et al., 2013',['Wie früh vor dem Schlafen kann Kaffee den Schlaf noch messbar kürzen?',['1 Stunde','3 Stunden','6 Stunden'],2]]],
'29_Substanzen':[['Eine Auswertung von 20 Laborstudien mit zusammen über 500 gesunden Teilnehmenden zeigt: Alkohol verkürzt das Einschlafen und vertieft die erste Nachthälfte, stört aber die zweite Nachthälfte und verzögert den ersten REM-Schlaf.','https://doi.org/10.1111/acer.12006','Ebrahim et al., 2013',['Verbessert ein Glas Alkohol am Abend den Schlaf der ganzen Nacht?',['Ja, durchgehend','Nur in der ersten Nachthälfte'],1]]],
'32_Letzte_Stunde':[['In einem Schlaflabor-Experiment mit 12 jungen Erwachsenen brauchte, wer abends vier Stunden auf einem leuchtenden Tablet las, etwa 10 Minuten länger zum Einschlafen als Print-Leser. Außerdem sank das Schlafhormon Melatonin, und die innere Uhr verschob sich nach hinten.','https://pubmed.ncbi.nlm.nih.gov/25535358/','Chang et al., PNAS 2015',['Wer schlief in dieser Studie schneller ein?',['Tablet-Leser','Print-Leser','Kein Unterschied'],1]]],
'33_Schlafumgebung':[['Die WHO empfiehlt für guten Schlaf nachts unter 30 dB(A) im Schlafzimmer. Draußen sollte der Jahresmittelwert nachts 40 dB nicht überschreiten, etwa eine ruhige Wohnstraße. Darüber nehmen Schlafstörungen zu.','https://www.who.int/europe/publications/i/item/9789289041737','WHO Night Noise Guidelines, 2009']],
'34_Tageslicht':[['In einer Studie mit 109 Büroangestellten schliefen Personen mit viel wirksamem Licht am Morgen (Tageslicht oder Lampen) schneller ein und gaben bessere Schlafqualität an als Personen mit wenig Morgenlicht. Beobachtung, kein Beweis für Ursache und Wirkung.','https://scholars.mssm.edu/en/publications/the-impact-of-daytime-light-exposures-on-sleep-and-mood-in-office-2/fingerprints/','Figueiro et al., Sleep Health 2017']],
'35_Sport_Aktivitaet':[['Eine systematische Übersicht zeigt vielversprechende Ergebnisse für bestimmte Schlafinterventionen bei Sportlern. Das belegt weder die Wirksamkeit dieses Fragebogens noch garantiert es eine Leistungssteigerung.','https://pubmed.ncbi.nlm.nih.gov/37462808/','PubMed']],
'36_Spaetes_Training':[['Eine Meta-Analyse über 23 Studien an gesunden Erwachsenen fand im Schnitt keine Verschlechterung des Schlafs nach Abendtraining. Nach sehr intensivem Training, das weniger als eine Stunde vor dem Zubettgehen endet, können Einschlafen und Schlafzeit leiden.','https://pubmed.ncbi.nlm.nih.gov/30374942/','Stutz et al., Sports Medicine 2019',['Schadet Abendtraining gesunden Erwachsenen im Schnitt dem Schlaf?',['Ja, immer','Meist nicht'],1]]],
'37b_Erholung':[['Elf Basketballspieler einer Uni-Mannschaft verlängerten über mehrere Wochen ihre Zeit im Bett auf mindestens 10 Stunden. Danach liefen sie den Sprint schneller (16,2 statt 15,5 Sekunden) und berichteten weniger Müdigkeit. Kleine Studie, nicht auf jeden übertragbar.','https://pmc.ncbi.nlm.nih.gov/articles/PMC3119836/','Mah et al., Sleep 2011']],
'40_Warnzeichen':[['Schnarchen, Luftschnappen und beobachtete Atemaussetzer können ein Anlass für eine ärztliche Abklärung sein. Fragebogen und Coaching stellen keine Diagnose.','https://www.nhlbi.nih.gov/health/sleep-apnea','NHLBI']],
